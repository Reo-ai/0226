<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:2500px;height:843px;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;background:#0f3d2e}
.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:10px;width:2500px;height:843px}
.c{border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.done{background:linear-gradient(160deg,#22c55e,#15803d);color:#fff}
.sub{background:#ecfdf5;color:#14532d}
.e{font-size:180px;line-height:1.1}.t{font-size:104px;font-weight:800;margin-top:20px}.s{font-size:50px;margin-top:10px;opacity:.85}
</style></head><body><div class="g">
<div class="c done"><div class="e">✅</div><div class="t">できた！</div><div class="s">今日の記録をつける</div></div>
<div class="c sub"><div class="e">🔥</div><div class="t">記録</div><div class="s">連続日数・バッジ</div></div>
<div class="c sub"><div class="e">⚙️</div><div class="t">習慣の設定</div><div class="s">行動・通知時間</div></div>
</div></body></html>
