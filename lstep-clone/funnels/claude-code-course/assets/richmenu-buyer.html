<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="rpg-menu.css">
<style>
/* 上の細い帯（高さ240px）：応募リマインドを始めるボタン。マス目はその下（lib/richmenu.ts の full-4-strip-top と同じ区切り） */
.g{height:1446px !important;top:240px;padding-top:7px}
.strip{position:absolute;left:0;top:0;width:2500px;height:240px;display:flex;align-items:center;justify-content:center;gap:34px;
  background:linear-gradient(180deg,#1c2a58,#0f1736);border-bottom:6px solid #d6ad55;box-shadow:inset 0 0 0 8px #0b1230,inset 0 0 0 11px rgba(217,178,92,.55)}
.strip .ic{font-size:96px}
.strip b{font-family:"Hiragino Sans",sans-serif;font-weight:800;font-size:92px;letter-spacing:4px;
  background:linear-gradient(180deg,#fff6d8,#f3d58a 45%,#c8963a);-webkit-background-clip:text;color:transparent}
.strip .sub{font-family:"Hiragino Sans",sans-serif;font-weight:700;font-size:52px;color:#efe6cc}
.strip .go{font-size:110px;color:#f3d58a;margin-left:10px}
.c .txt{bottom:40px}.c .t{font-size:104px}
</style></head><body>
<div class="g" style="position:absolute;left:0;top:240px;height:1446px;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)">
<div class="c main" style="background-image:url(richmenu-art/start.png);background-position:center 22%;background-size:118%">
<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
<div class="tag">START</div><div class="txt"><div class="t">冒険を始める</div><div class="s">今日のクエストを確認</div></div></div><div class="c" style="background-image:url(richmenu-art/worldmap.png);background-position:center 40%;background-size:cover">
<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
<div class="tag">MAP</div><div class="txt"><div class="t">World マップ</div><div class="s">冒険の書（講座）を開く</div></div></div><div class="c" style="background-image:url(richmenu-art/guild.png);background-position:center 30%;background-size:cover">
<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
<div class="tag">GUILD</div><div class="txt"><div class="t">講師に相談</div><div class="s">つまずいたらここ</div></div></div><div class="c" style="background-image:url(richmenu-art/log.png);background-position:center 40%;background-size:cover">
<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
<div class="tag">LOG</div><div class="txt"><div class="t">旅の記録</div><div class="s">感想・できたことを送る</div></div></div>
</div>
<div class="strip"><span class="ic">📮</span><b>応募リマインド</b><span class="sub">毎日 昼・夜に「今日の20件」をお知らせ</span><span class="go">›</span></div>
</body></html>
