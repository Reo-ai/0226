# サーバーレス（Vercel等）で動かす場合の定期実行（GitHub Actions は公開/非公開とも無料枠内）
# リポジトリの Settings > Secrets and variables > Actions に APP_URL と CRON_SECRET を登録すると有効になります
name: cron
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run due jobs
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL 未設定のためスキップ"; exit 0; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron"
