# スキルステップ（lstep-clone）のステップ配信・予約配信・リマインドを5分ごとに動かすタイマー。
# GitHub の定期実行は既定ブランチのリポジトリ直下にあるものしか動かないため、ここに置いている。
# リポジトリの Actions シークレット APP_URL と CRON_SECRET が未設定なら何もしない。
name: skillstep-cron
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run due jobs
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL 未設定のためスキップ"; exit 0; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron"
