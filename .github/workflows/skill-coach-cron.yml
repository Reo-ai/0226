# スキルコーチ（lstep-clone）の定期実行：ステップ配信・予約配信・習慣リマインドを5分おきに処理する
# 本体はブランチ claude/gifted-dijkstra-awggr9 の lstep-clone/。GitHub の定期実行は既定ブランチにしか置けないため、ここに置いている
# リポジトリの Settings > Secrets and variables > Actions に CRON_SECRET を登録すると動く
name: skill-coach-cron
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run due jobs
        env:
          APP_URL: https://skill-step-hazel.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET 未設定のためスキップ"; exit 0; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron"
