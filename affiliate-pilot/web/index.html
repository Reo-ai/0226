<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Affiliate Pilot かんたん版</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* Layout: 深緑のサイドバー（スマホは下部タブ）＋ 中央1カラムに「今日の1歩」。初心者向けに画面ごとに1つの仕事だけ置く */
:root {
  --bg: #f3f7f4; --card: #ffffff; --fg: #1d2b26; --muted: #5f6f68; --line: #dde5e0; --soft: #edf2ef;
  --accent: #c2521a; --accent-ink: #ffffff; --accent-soft: #fbeadf;
  --side: #1d3a33; --side-fg: #c9dad3;
  --good: #1f8a52; --good-soft: #e3f3ea; --warn: #a66a00; --bad: #c0392b; --c2: #0f9488;
  --font: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121916; --card: #1a231f; --fg: #e3ebe7; --muted: #9aaba3; --line: #2c3833; --soft: #222d29;
  --accent: #d96a28; --accent-ink: #ffffff; --accent-soft: #3a2518; --side: #0c1210; --side-fg: #a8bbb3;
  --good: #5fd497; --good-soft: #1b3127; --warn: #f2c14e; --bad: #f08074; --c2: #22a08c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121916; --card: #1a231f; --fg: #e3ebe7; --muted: #9aaba3; --line: #2c3833; --soft: #222d29;
  --accent: #d96a28; --accent-ink: #ffffff; --accent-soft: #3a2518; --side: #0c1210; --side-fg: #a8bbb3;
  --good: #5fd497; --good-soft: #1b3127; --warn: #f2c14e; --bad: #f08074; --c2: #22a08c; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.65; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; line-height: 1.3; text-wrap: balance; }
.app { display: flex; min-height: 100%; }
.side { position: sticky; top: 0; height: 100dvh; width: 230px; flex-shrink: 0; background: var(--side); color: var(--side-fg); padding: 20px 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; color: #fff; font-weight: 700; }
.brand small { display: block; font-weight: 400; font-size: 11px; opacity: .7; }
.side a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: inherit; text-decoration: none; }
.side a[aria-current="page"] { background: rgba(255,255,255,.1); color: #fff; font-weight: 700; box-shadow: inset 3px 0 0 var(--accent); }
.side a:hover { background: rgba(255,255,255,.07); color: #fff; }
.side .foot { margin-top: auto; font-size: 11px; opacity: .55; padding: 8px; }
.main { flex: 1; min-width: 0; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.top h1 { font-size: 22px; font-weight: 900; }
.top p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: 0 1px 2px rgba(29,43,38,.05); }
.card h2 { font-size: 16px; margin-bottom: 8px; }
.hero { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.hero .eyebrow { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
.hero h2 { font-size: 21px; font-weight: 900; margin: 4px 0 6px; }
.hero p.desc { color: var(--muted); margin: 0 0 14px; }
.stages { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; list-style: none; padding: 0; margin: 0; font-size: 12px; text-align: center; }
.stages li { border: 1px solid var(--line); border-radius: 10px; padding: 7px 4px; color: var(--muted); background: var(--card); }
.stages li small { display: block; font-size: 10px; }
.stages li.now { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); font-weight: 700; }
.stages li.done { border-color: color-mix(in srgb, var(--good) 50%, var(--line)); background: var(--good-soft); color: var(--good); }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 500; text-decoration: none; color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.big { padding: 13px 20px; font-size: 16px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500; min-width: 0; }
label.f .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
input, select, textarea { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 9px; padding: 9px 11px; font-size: 15px; }
textarea { min-height: 110px; resize: vertical; }
details.more { border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; }
details.more summary { cursor: pointer; font-size: 13px; font-weight: 500; }
details.more > div { margin-top: 10px; }
.tasks { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 6px; }
.tasks li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; }
.tasks li.done { opacity: .6; text-decoration: line-through; }
.tasks li button { border: 0; background: none; cursor: pointer; color: var(--accent); padding: 0; font-size: 18px; line-height: 1.2; }
.tasks .t { flex: 1; min-width: 0; } .tasks .t small { display: block; color: var(--muted); }
.linkcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.linkcards a { display: block; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); text-decoration: none; color: var(--fg); }
.linkcards a:hover { border-color: var(--accent); }
.linkcards a strong { display: block; } .linkcards a span { font-size: 12px; color: var(--muted); }
.kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.kpi div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.kpi div span { font-size: 12px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
.kpi div strong { display: block; font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
.kpi div em { font-style: normal; font-size: 11px; color: var(--muted); }
.term { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--line); font-size: 11px; color: var(--muted); cursor: pointer; background: none; padding: 0; }
.pop { position: fixed; z-index: 20; max-width: 280px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.15); font-size: 13px; }
.bar { height: 12px; background: var(--soft); border-radius: 99px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; background: var(--soft); color: var(--muted); }
.pill.good { background: var(--good-soft); color: var(--good); } .pill.acc { background: var(--accent-soft); color: var(--accent); }
.tbl { overflow-x: auto; } table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; } th { color: var(--muted); font-weight: 500; font-size: 12px; } td.n, th.n { text-align: right; }
.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--side); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 30; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.lesson p { margin: 8px 0; max-width: 42em; } .lesson h3 { font-size: 16px; margin: 18px 0 4px; } .lesson ul, .lesson ol { padding-left: 22px; margin: 6px 0; }
.note { border-left: 3px solid var(--warn); background: var(--soft); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 13px; }
.quiz li { list-style: none; } .quiz label { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; cursor: pointer; font-weight: 400; } .quiz input { width: auto; margin-top: 4px; }
.courses { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.courses button { text-align: left; border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.courses button:hover { border-color: var(--accent); }
.lessons { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.lessons button { width: 100%; text-align: left; display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 10px 12px; cursor: pointer; }
.lessons button .n { width: 26px; height: 26px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
.lessons button.done .n { background: var(--good-soft); color: var(--good); }
pre.out { white-space: pre-wrap; word-break: break-word; background: var(--soft); border-radius: 10px; padding: 12px; font-family: inherit; margin: 0; }
.lint li { font-size: 13px; } .lint .ng { color: var(--bad); } .lint .ok { color: var(--good); }
.bottom { display: none; }
.chart { width: 100%; height: auto; }
@media (max-width: 900px) {
  .side { display: none; }
  .main { padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
  .bottom { display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 6px 0; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); z-index: 10; }
  .bottom a { text-decoration: none; color: var(--muted); text-align: center; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .bottom a svg { width: 22px; height: 22px; } .bottom a[aria-current="page"] { color: var(--accent); font-weight: 700; }
  .stages { font-size: 11px; }
}
@media (prefers-reduced-motion: no-preference) { .wrap { animation: in .25s ease-out; } @keyframes in { from { opacity: .4; transform: translateY(4px); } } }
</style>
</head>
<body>

<div class="app">
  <nav class="side" aria-label="メインメニュー" id="sidenav"></nav>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>
<nav class="bottom" aria-label="下部メニュー" id="bottomnav"></nav>

<script>
(function () {
"use strict";
window.addEventListener("error", (e) => { const d = document.createElement("div"); d.className = "toast"; d.style.background = "var(--bad)"; d.textContent = "エラー: " + e.message; document.body.appendChild(d); });
// ---------- データ（このブラウザにだけ保存） ----------
const KEY = "affiliate-pilot-simple-v1";
let COURSES = [];
const COURSES_URL = "https://raw.githubusercontent.com/Reo-ai/0226/claude/tiktok-auto-pipeline-JXaiW/affiliate-pilot/public/courses.json";
let coursesError = false;
fetch(COURSES_URL).then((r) => r.json()).then((d) => { COURSES = d; render(); }).catch(() => { coursesError = true; render(); });
const PLATFORMS = { blog: "ブログ", instagram: "Instagram", x: "X（旧Twitter）", tiktok: "TikTok", youtube: "YouTube" };
const OFFER_STATUS = { candidate: "候補", applied: "申請中", approved: "提携済み", rejected: "否認", paused: "停止" };
const ASPS = ["A8.net", "もしもアフィリエイト", "afb（アフィb）", "バリューコマース", "アクセストレード", "Amazonアソシエイト", "楽天アフィリエイト", "その他"];
const TERMS = {
  clicks: ["クリック数", "あなたのリンクが押された回数。ASPの管理画面や計測リンクで分かります。"],
  pending: ["発生報酬", "読者が申し込みや購入をして、ASPに「仮」の成果が記録された金額。まだ確定ではありません。"],
  confirmed: ["確定報酬", "広告主が成果を認めて「承認」された金額。これが実際にもらえる金額です。"],
  paid: ["入金額", "実際に口座へ振り込まれた金額。確定から1〜2か月後になることが多いです。"],
  ctr: ["CTR（クリック率）", "クリック数 ÷ 表示回数。100人が見て2人が押せば 2%。"],
  cvr: ["CVR（成約率）", "発生した成果の数 ÷ クリック数。目安は 1〜3%。"],
  imp: ["表示回数", "投稿や記事が見られた回数。SNSの「インプレッション」「閲覧数」です。"],
};
let S = load();
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return { profile: null, tasks: {}, records: [], offers: [], drafts: [], progress: {}, flags: {} };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const uid = () => Math.random().toString(36).slice(2, 10);
const todayKey = (d = new Date()) => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
const addDays = (k, n) => { const d = new Date(k + "T00:00:00"); d.setDate(d.getDate() + n); return todayKey(d); };
const yen = (v) => v == null ? "未計測" : "¥" + Math.round(v).toLocaleString("ja-JP");
const pct = (v, d = 1) => v == null ? "—" : (v * 100).toFixed(d) + "%";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const sum = (arr, k) => { const xs = arr.map((r) => r[k]).filter((v) => v != null); return xs.length ? xs.reduce((a, b) => a + b, 0) : null; };
const ratio = (a, b) => (a == null || b == null || b === 0) ? null : a / b;

// ---------- 今日のタスク（ルールで決める） ----------
function stage() {
  if (!S.profile) return 1;
  const days = Math.floor((new Date(todayKey() + "T00:00:00") - new Date(S.profile.started + "T00:00:00")) / 86400000);
  return days < 14 ? 1 : days < 30 ? 2 : days < 60 ? 3 : 4;
}
function lessonsDone(courseId) { const c = COURSES.find((x) => x.id === courseId); return c ? c.lessons.filter((l) => S.progress[l.id]?.done).length : 0; }
function buildTasks() {
  const p = S.profile, t = [], add = (x) => t.push({ id: uid(), status: "todo", ...x });
  const approved = S.offers.filter((o) => o.status === "approved").length;
  const yesterday = addDays(todayKey(), -1);
  const aspDone = lessonsDone("asp");
  if (aspDone < 3) add({ title: "「ASP完全攻略」を1レッスン進める", desc: "ASPの仕組みが分かると、案件選びで迷わなくなります。", min: 15, go: "learn", pri: 1 });
  if (S.offers.length < 3) add({ title: `ASPで案件を探し、候補を${3 - S.offers.length}件登録する`, desc: "報酬額や条件は、ASPの画面で確認した値だけを入力します。", min: 25, go: "offers", pri: 2 });
  else if (!approved) add({ title: "候補の案件に提携申請し、結果を記録する", desc: "承認まで数日かかることがあります。承認後に広告リンクを取得します。", min: 15, go: "offers", pri: 2 });
  if (approved || aspDone >= 3) add({ title: `${PLATFORMS[p.platform]}の投稿・記事を1本作る`, desc: "「投稿を作る」で下書き → チェック → 公開。", min: p.platform === "blog" ? 60 : 40, go: "make", pri: 2 });
  if (!S.records.some((r) => r.date === yesterday) && (S.drafts.length || S.records.length)) add({ title: "昨日の数字（クリック・成果）を記録する", desc: "ASPとSNSの管理画面から転記。分からない値は空欄でOK。", min: 10, go: "record", pri: 2 });
  if (new Date().getDay() === 1 && S.records.length >= 3) add({ title: "1週間を振り返り、来週の重点を決める", desc: "「成果を記録」の14日グラフで、伸びた日・伸びなかった日を見比べます。", min: 20, go: "record", pri: 2 });
  if (S.records.length >= 7) add({ title: "クリック率の低い投稿を1つ直す", desc: "リンクの位置や、行動をうながす一文を変えて様子を見ます。", min: 25, go: "make", pri: 3 });
  add({ title: "攻略大学で1レッスン学ぶ", desc: "いまの段階に合う講座から進めましょう。", min: 15, go: "learn", pri: 4 });
  t.sort((a, b) => a.pri - b.pri);
  const out = []; let used = 0;
  for (const x of t) { if (out.length >= 4) break; if (used + x.min <= p.minutes || out.length === 0) { out.push(x); used += x.min; } }
  return out;
}
function todayTasks() {
  const k = todayKey();
  if (!S.tasks[k]) { S.tasks = { [k]: buildTasks() }; save(); }
  return S.tasks[k];
}

// ---------- 画面 ----------
const NAV = [["home", "ホーム"], ["learn", "学ぶ"], ["make", "投稿を作る"], ["record", "成果を記録"], ["offers", "案件"], ["recommend", "おすすめ案件"], ["settings", "設定"]];
const ICON = { home: "M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z", learn: "M12 3l10 5-10 5L2 8l10-5zm-6 9v4c0 1 3 3 6 3s6-2 6-3v-4", make: "M4 20h4l10-10-4-4L4 16v4zm10-14l4 4", record: "M4 20V10m6 10V4m6 16v-7", offers: "M3 7h18v12H3zM3 11h18M8 7V5h8v2", recommend: "M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4L12 3zm6 10l.9 2.1L21 16l-2.1.9L18 19l-.9-2.1L15 16l2.1-.9L18 13zM5 14l.7 1.6L7.5 16l-1.8.7L5 18.5l-.7-1.8L2.5 16l1.8-.4L5 14z", settings: "M12 8a4 4 0 100 8 4 4 0 000-8zm8 4l2-1-1-3-2 0-1-2 1-2-2-2-2 1-2-1 0-2H9l0 2-2 1-2-1-2 2 1 2-1 2-2 0-1 3 2 1 0 2-1 2 2 2 2-1 2 1 0 2h6l0-2 2-1 2 1 2-2-1-2 1-2 2 0 1-3-2-1z" };
const svg = (k) => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="${ICON[k]}"/></svg>`;
let route = "home", sub = null;
function nav() {
  const cur = route === "lesson" ? "learn" : route;
  document.getElementById("sidenav").innerHTML = `<div class="brand"><svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2" opacity=".55"/><path d="M16 5 L20 16 L16 27 L12 16 Z" fill="var(--accent)"/><path d="M5 16 L16 12 L27 16 L16 20 Z" fill="currentColor" opacity=".9"/></svg><span>Affiliate Pilot<small>かんたん版・ブラウザで動く</small></span></div>`
    + NAV.map(([k, l]) => `<a href="#${k}" ${cur === k ? 'aria-current="page"' : ""}>${svg(k)}${l}</a>`).join("")
    + `<div class="foot">データはこのブラウザの中にだけ保存されます</div>`;
  document.getElementById("bottomnav").innerHTML = NAV.filter(([k]) => k !== "settings").map(([k, l]) => `<a href="#${k}" ${cur === k ? 'aria-current="page"' : ""}>${svg(k)}${l.replace("投稿を作る", "作る").replace("成果を記録", "記録").replace("おすすめ案件", "提案")}</a>`).join("");
}
function go(r, s) { sub = s ?? null; if (location.hash !== "#" + r) location.hash = r; else render(); }
function render() {
  route = (location.hash || "#home").slice(1); if (!NAV.some(([k]) => k === route) && route !== "lesson") route = "home";
  nav();
  const v = document.getElementById("view");
  if (!S.profile && route === "home") { v.innerHTML = onboarding(); bind(v); window.scrollTo(0, 0); return; }
  v.innerHTML = { home, learn, lesson, make, record, offers, settings, recommend: recommendView }[route]();
  bind(v); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);

function tips() {
  const r = S.records.slice(-14), clicks = sum(r, "clicks"), imp = sum(r, "imp"), conv = sum(r, "conv"), ctr = ratio(clicks, imp), cvr = ratio(conv, clicks);
  const out = [];
  if (ctr != null && ctr < 0.01) out.push("クリック率が1%未満です。リンクを文章の前半にも置く、行動をうながす一文（「公式サイトで料金を見る」など）を添えると改善しやすいです。");
  if (cvr != null && cvr < 0.005 && clicks >= 50) out.push("クリックはあるのに成果が少ない状態です。案件の成果条件（無料登録か購入か）と、投稿の内容が合っているか見直しましょう。");
  if (!S.offers.some((o) => o.status === "approved") && S.records.length) out.push("提携済みの案件がまだありません。「案件」で申請状況を更新しましょう。");
  return out.length ? `<div class="note" style="margin-top:12px"><strong>改善のヒント</strong><ul style="margin:4px 0 0;padding-left:18px">${out.map((x) => `<li>${x}</li>`).join("")}</ul></div>` : "";
}
const term = (k) => `<button type="button" class="term" data-term="${k}" aria-label="${TERMS[k][0]}の説明">?</button>`;

  <div class="row">${nxt ? `<button class="btn" data-lesson="${nxt.id}">次のレッスン：${esc(nxt.title)} →</button>` : `<button class="btn" data-go="learn">講座一覧へ</button>`}${l.actions?.length ? `<a class="btn" href="#${l.actions[0].href?.includes("offers") ? "offers" : l.actions[0].href?.includes("content") ? "make" : l.actions[0].href?.includes("analytics") ? "record" : "home"}">${esc(l.actions[0].label)}</a>` : ""}</div>`;

// ---------- 投稿を作る（テンプレート。AIは使わない） ----------
const TYPES = { ig: "Instagram キャプション", x: "X の投稿", blog: "ブログ記事の書き出し", cta: "行動をうながす一文（CTA）" };
function generate(type, o, target, point) {
  const name = o ? o.name : "この商品", tgt = target || "気になっている人", pt = point || "（根拠資料で確認した特徴をここに）";
  const pr = "#PR ";
  if (type === "x") return `${pr}${tgt}へ。${name}を使ってみた正直な感想。\n\n良かった点：${pt}\n気になった点：（正直に書く）\n\n詳しくはプロフィールのリンクから。`;
  if (type === "blog") return `${pr}【この記事は広告（アフィリエイトリンク）を含みます】\n\n「${tgt}」なら、${name}が選択肢に入ります。この記事では、公式情報と自分で使った範囲で分かったことだけをまとめます。\n\n## 結論\n${pt}\n\n## 向いている人・向いていない人\n- 向いている人：\n- 向いていない人：\n\n## 料金と始め方（公式サイトで確認した内容）\n`;
  if (type === "cta") return `公式サイトで料金と条件を確認する →（${name}）`;
  return `${pr}${tgt}に向けて、${name}を紹介します。\n\n✔ ${pt}\n✔（2つ目の特徴）\n✔（3つ目の特徴）\n\n気になった点も正直に：\n（ここに書く）\n\n詳しくはプロフィールのリンクから。\n#${(S.profile?.niche || "暮らし").replace(/\s/g, "")} #PR`;
}
function lint(text) {
  const out = [];
  out.push(/#PR|広告|プロモーション/.test(text) ? ["ok", "広告であることの表記（#PR など）があります"] : ["ng", "「#PR」や「広告を含みます」の表記がありません（ステマ規制）"]);
  const ng = ["絶対", "必ず", "100%", "確実に", "誰でも稼げる", "痩せる", "治る"].filter((w) => text.includes(w));
  out.push(ng.length ? ["ng", "言い切り・効果を保証する表現があります：" + ng.join("、")] : ["ok", "言い切り・効果保証の表現はありません"]);
  out.push(/（.*?）/.test(text) ? ["ng", "（ ）の下書きメモが残っています。書き換えてください"] : ["ok", "書き換えメモは残っていません"]);
  out.push(["ok", `${text.length}文字`]);
  return out;
}

  ${S.drafts.length ? `<section class="card"><h2>保存した下書き（${S.drafts.length}件）</h2><ul class="tasks">${S.drafts.slice().reverse().map((d) => `<li><div class="t">${esc(d.title)}<small>${d.createdAt.slice(0, 10)}・${d.body.length}文字</small></div><button class="btn" data-opendraft="${d.id}">開く</button><button class="btn ghost" data-deldraft="${d.id}">削除</button></li>`).join("")}</ul></section>` : ""}`;
}

// ---------- 成果を記録 ----------
function record() {
  const m = todayKey().slice(0, 7), mrec = S.records.filter((r) => r.date.startsWith(m));
  const clicks = sum(mrec, "clicks"), imp = sum(mrec, "imp"), conv = sum(mrec, "conv");
  const days = Array.from({ length: 14 }, (_, i) => addDays(todayKey(), i - 13));
  const series = days.map((d) => ({ d, v: sum(S.records.filter((r) => r.date === d), "confirmed") ?? 0, p: sum(S.records.filter((r) => r.date === d), "pending") ?? 0 }));
  const max = Math.max(1, ...series.map((s) => Math.max(s.v, s.p)));
  const W = 560, H = 150, bw = W / 14;
  const chart = `<svg class="chart" viewBox="0 0 ${W + 10} ${H + 28}" role="img" aria-label="直近14日の発生報酬と確定報酬"><g font-size="10" fill="var(--muted)">${series.map((s, i) => `<rect x="${i * bw + 6}" y="${H - s.p / max * H}" width="${bw * .35}" height="${s.p / max * H}" fill="var(--c2)" opacity=".7"><title>${s.d} 発生 ${yen(s.p)}</title></rect><rect x="${i * bw + 6 + bw * .4}" y="${H - s.v / max * H}" width="${bw * .35}" height="${s.v / max * H}" fill="var(--accent)"><title>${s.d} 確定 ${yen(s.v)}</title></rect>${i % 3 === 0 ? `<text x="${i * bw + 6}" y="${H + 16}">${s.d.slice(5).replace("-", "/")}</text>` : ""}`).join("")}<line x1="0" x2="${W + 10}" y1="${H}" y2="${H}" stroke="var(--line)"/></g></svg><p class="small muted" style="margin:0"><span style="color:var(--c2)">■</span> 発生　<span style="color:var(--accent)">■</span> 確定　（最大 ${yen(max)}）</p>`;
  return `<div class="top"><div><h1>成果を記録</h1><p>発生（仮）・確定（承認済み）・入金を分けて記録します。空欄は「未計測」として 0 と区別します。</p></div></div>
  <div class="kpi"><div><span>確定報酬 ${term("confirmed")}</span><strong>${yen(sum(mrec, "confirmed"))}</strong><em>今月</em></div><div><span>発生報酬 ${term("pending")}</span><strong>${yen(sum(mrec, "pending"))}</strong><em>今月</em></div><div><span>クリック ${term("clicks")}</span><strong>${clicks ?? "未計測"}</strong><em>今月</em></div><div><span>CTR ${term("ctr")}</span><strong>${pct(ratio(clicks, imp))}</strong><em>クリック ÷ 表示</em></div><div><span>CVR ${term("cvr")}</span><strong>${pct(ratio(conv, clicks))}</strong><em>成約 ÷ クリック</em></div></div>
  <section class="card"><h2>直近14日</h2>${S.records.length ? chart : '<p class="muted small" style="margin:0">記録がまだありません。下のフォームから昨日の数字を入れましょう。</p>'}</section>
  <form onsubmit="return false" class="card" id="rec" style="display:flex;flex-direction:column;gap:12px"><h2>記録する</h2>
    <div class="grid2"><label class="f">日付<input id="r-date" type="date" value="${addDays(todayKey(), -1)}" required></label><label class="f">媒体<select id="r-pf">${Object.entries(PLATFORMS).map(([k, l]) => `<option value="${k}" ${k === S.profile?.platform ? "selected" : ""}>${l}</option>`).join("")}</select></label>
    <label class="f">クリック数<input id="r-clicks" type="number" min="0" inputmode="numeric" placeholder="空欄＝未計測"></label><label class="f">発生報酬（円）<input id="r-pending" type="number" min="0" inputmode="numeric" placeholder="空欄＝未計測"><span class="hint">ASPの「発生」「未確定」の合計</span></label><label class="f">確定報酬（円）<input id="r-confirmed" type="number" min="0" inputmode="numeric" placeholder="空欄＝未計測"><span class="hint">ASPで「承認」された分</span></label></div>

// ---------- 案件 ----------

  return `<div class="top"><div><h1>案件</h1><p>ASPで見つけた案件を登録して、提携状況を管理します。</p></div></div>

    <div class="grid2"><label class="f">ASP<select id="o-asp">${ASPS.map((a) => `<option ${o?.asp === a ? "selected" : ""}>${a}</option>`).join("")}</select></label><label class="f">1件の報酬（円）<input id="o-amount" type="number" min="0" inputmode="numeric" value="${o?.amount ?? ""}"><span class="hint">ASPで確認した値だけ</span></label><label class="f">提携状態<select id="o-status">${Object.entries(OFFER_STATUS).map(([k, l]) => `<option value="${k}" ${o?.status === k ? "selected" : ""}>${l}</option>`).join("")}</select></label></div>
    <details class="more" ${o?.note || o?.cond ? "open" : ""}><summary>くわしく入力する（成果条件・承認率・メモ）</summary><div style="display:flex;flex-direction:column;gap:10px"><label class="f">成果条件<input id="o-cond" value="${esc(o?.cond ?? "")}" placeholder="例: 新規の無料会員登録完了"></label><label class="f">承認率（%・ASPに表示があれば）<input id="o-appr" type="number" min="0" max="100" value="${o?.appr ?? ""}"></label><label class="f">メモ<input id="o-note" value="${esc(o?.note ?? "")}" placeholder="NG表現、特別単価の条件など"></label></div></details>
    <div class="row"><button class="btn primary" type="submit">${o ? "更新する" : "登録する"}</button>${o ? '<button class="btn ghost" type="button" data-go="offers">キャンセル</button>' : ""}</div></form>

function detectPlatform(url) {
  const u = url.toLowerCase();
  if (/instagram\.com/.test(u)) return "instagram";
  if (/(^|\/\/)(www\.)?(x\.com|twitter\.com)/.test(u)) return "x";
  if (/youtube\.com|youtu\.be/.test(u)) return "youtube";
  if (/tiktok\.com/.test(u)) return "tiktok";
  if (/note\.com/.test(u)) return "note";
  if (/^https?:\/\//.test(u)) return "website";
  return "unknown";
}
function classify(input) {
  const title = (input.title || "").toLowerCase(), desc = (input.description || "").toLowerCase();
  const heads = (input.headings || []).join(" ").toLowerCase(), body = (input.body || "").toLowerCase();
  const count = (text, kw) => { if (!kw || !text) return 0; let n = 0, i = 0; const k = kw.toLowerCase(); while ((i = text.indexOf(k, i)) !== -1) { n++; i += k.length; if (n >= 30) break; } return n; };
  const scored = GENRES.map((g) => {
    let score = 0; const hits = new Set();
    for (const [kws, w] of [[g.strong, 2], [g.weak, 1]]) for (const kw of kws) {
      const s = w * (count(title, kw) * 6 + count(desc, kw) * 4 + Math.min(count(heads, kw), 10) * 2 + Math.min(count(body, kw), 30) * 0.5);
      if (s > 0) { score += s; hits.add(kw); }
    }
    return { id: g.id, label: g.label, score, hits: [...hits].slice(0, 8) };
  }).filter((g) => g.score > 0).sort((a, b) => b.score - a.score);
  const total = scored.reduce((a, g) => a + g.score, 0) || 1;
  return scored.map((g) => ({ ...g, share: g.score / total }));
}
function fromText(text, title) {
  const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
  return { title: title || (lines[0] || "").slice(0, 80), description: lines.slice(1, 3).join(" "), headings: lines.filter((l) => l.length <= 40).slice(0, 30), body: text.slice(0, 30000) };
}

  const confidence = !top.length ? "low" : top[0].share >= 0.45 && len > 800 ? "high" : top[0].share >= 0.3 && len > 300 ? "medium" : "low";
  const picks = top.map((g) => GENRES.find((x) => x.id === g.id));

}

async function fetchViaReader(url) {
  // ブラウザからは他サイトを直接読めない（CORS）ため、公開ページをテキスト化する外部サービス（Jina Reader）を経由する
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 20000);
  try {
    const r = await fetch("https://r.jina.ai/" + url, { signal: ctrl.signal, headers: { Accept: "text/plain" } });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const text = await r.text();
    const title = (text.match(/^Title:\s*(.+)$/m) || [])[1] || "";
    const body = text.replace(/^(Title|URL Source|Published Time|Markdown Content):.*$/gm, "").trim();
    return { title, description: body.slice(0, 300), headings: (body.match(/^#{1,3}\s+.+$/gm) || []).map((h) => h.replace(/^#+\s*/, "")).slice(0, 60), body: body.slice(0, 30000) };
  } finally { clearTimeout(t); }
}

    <label class="f">URL<input id="rc-url" type="url" placeholder="https://example.com/ または https://www.instagram.com/あなたのID/"><span class="hint">URLの読み取りは外部サービス（Jina Reader）を経由します。SNSは取得できる情報が少ないので、下にも貼り付けてください。</span></label>
    <label class="f">プロフィール文・投稿本文・記事のテキスト（SNSは推奨）<textarea id="rc-text" placeholder="最近の投稿のキャプションを3〜5件、記事の冒頭などを貼り付け"></textarea></label>
    <button class="btn primary big" type="submit" style="align-self:flex-start" ${recState.busy ? "disabled" : ""}>${recState.busy ? "分析中…" : "おすすめ案件を提案する"}</button>
    ${recState.note ? `<p class="note">${esc(recState.note)}</p>` : ""}
  </form>
  ${r ? `<section class="card"><div class="row"><h2 style="margin:0">${esc((r.title || "貼り付けたテキスト").slice(0, 40))}</h2><span class="pill">${PLATFORM_LABEL[r.platform]}</span><span class="pill ${r.confidence === "high" ? "good" : r.confidence === "medium" ? "acc" : ""}">確からしさ：${CONF[r.confidence]}</span></div>
    ${r.notes.map((n) => `<p class="note" style="margin-top:8px">${esc(n)}</p>`).join("")}
    <p class="small" style="margin:12px 0 4px;font-weight:700">ジャンル判定</p>
    ${r.genres.length ? r.genres.map((g) => `<div class="row" style="gap:6px;margin-bottom:4px"><span style="width:9em;font-size:13px">${esc(g.label)}</span><span class="bar" style="flex:1;height:8px"><i style="width:${Math.round(g.share * 100)}%"></i></span><span class="small muted" style="width:3em;text-align:right">${Math.round(g.share * 100)}%</span></div>`).join("") : '<p class="muted small">判定できませんでした</p>'}
  </section>
  ${r.picks.map((p, i) => `<section class="card"><h2>${i + 1}. ${esc(p.label)} に合う案件</h2><p class="small muted" style="margin:0 0 8px">探す場所：${p.asps.map(esc).join("・")}</p>
    <div class="grid2"><div><p class="small" style="margin:0 0 4px;font-weight:700">案件の種類と成果条件のタイプ</p>${p.offerTypes.map((o) => `<div style="border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:4px;font-size:13px"><strong>${esc(o.name)}</strong> <span class="muted">${esc(o.action)}</span></div>`).join("")}</div>
    <div><p class="small" style="margin:0 0 4px;font-weight:700">訴求の切り口</p><ul style="margin:0;padding-left:18px;font-size:13px">${p.angles.map((a) => `<li>${esc(a)}</li>`).join("")}</ul>${(p.cautions || []).length ? `<p class="note" style="margin-top:8px">${p.cautions.map(esc).join("<br>")}</p>` : ""}</div></div></section>`).join("")}
  ${r.matched.length ? `<section class="card"><h2>登録済みの案件で合うもの</h2><div class="row">${r.matched.map((o) => `<span class="pill acc">${esc(o.name)}</span>`).join("")}</div></section>` : ""}
  <p class="small muted">報酬額・承認率・成果条件はここでは表示しません。ASPの案件ページで確認した値を「案件」に登録してください。</p>` : ""}`;
}
async function runRecommend() {
  const url = $("rc-url").value.trim(), text = $("rc-text").value.trim();
  if (!url && !text) { toast("URLか、テキストのどちらかを入力してください"); return; }
  const platform = url ? detectPlatform(url) : "unknown";
  if (url && platform === "unknown") { toast("URLは https:// から入力してください"); return; }
  recState = { result: null, note: "", busy: true }; render(); $("rc-url").value = url; $("rc-text").value = text;
  let ex = null, note = "";
  if (url) { try { ex = await fetchViaReader(url); if ((ex.body || "").length < 200) note = "ページから読み取れた文章が少なめでした。テキストを貼り付けると精度が上がります。"; } catch (e) { note = "URLの内容を取得できませんでした（" + (e && e.message ? e.message : "通信エラー") + "）。貼り付けたテキストだけで判定します。"; } }
  if (text) { const t = fromText(text, ex && ex.title); ex = ex ? { ...ex, description: ex.description + " " + t.description, headings: ex.headings.concat(t.headings), body: ex.body + "\n" + t.body } : t; }
  if (!ex) { recState = { result: null, note: note || "内容を取得できませんでした。テキストを貼り付けてください。", busy: false }; render(); $("rc-url").value = url; return; }
  recState = { result: recommendFrom(ex, platform), note, busy: false }; render(); $("rc-url").value = url; $("rc-text").value = text;
  const first = document.querySelector("#view section.card"); if (first) first.scrollIntoView({ behavior: "smooth" });
}

// ---------- 操作 ----------
const $ = (id) => document.getElementById(id);
const num = (id) => { const v = $(id)?.value; return v === "" || v == null ? null : Number(v); };
function toast(msg) { document.querySelectorAll(".toast").forEach((x) => x.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }
async function copy(text) { try { await navigator.clipboard.writeText(text); toast("コピーしました"); } catch (e) { const ta = $("g-body") || document.createElement("textarea"); if (!ta.isConnected) { ta.value = text; document.body.appendChild(ta); } ta.select(); toast("選択しました。Ctrl+C / ⌘C でコピーしてください"); } }
function bind(v) {
  v.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => go(b.dataset.go));
  // 送信イベントが発火しない環境（埋め込み表示など）でも動くよう、ボタンのクリックで直接処理する
  setTimeout(() => v.querySelectorAll("form").forEach((f) => {
    const run = () => { if (f.reportValidity() && typeof f.onsubmit === "function") f.onsubmit(new Event("submit", { cancelable: true })); };
    f.querySelectorAll('button[type="submit"]').forEach((b) => { b.type = "button"; b.onclick = run; });
    f.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); run(); } });
  }), 0);
  v.querySelectorAll("[data-course]").forEach((b) => b.onclick = () => go("learn", b.dataset.course));
  v.querySelectorAll("[data-lesson]").forEach((b) => b.onclick = () => go("lesson", b.dataset.lesson));
  v.querySelectorAll("[data-term]").forEach((b) => b.onclick = (e) => showTerm(b, e));
  const tk = S.profile ? todayTasks() : [], setT = (id, st) => { const t = tk.find((x) => x.id === id); if (t) { t.status = st; save(); render(); if (st === "done") toast("おつかれさま！1歩進みました"); } };
  v.querySelectorAll("[data-done]").forEach((b) => b.onclick = () => setT(b.dataset.done, "done"));
  v.querySelectorAll("[data-skip]").forEach((b) => b.onclick = () => setT(b.dataset.skip, "skipped"));
  v.querySelectorAll("[data-toggle]").forEach((b) => b.onclick = () => { const t = tk.find((x) => x.id === b.dataset.toggle); setT(t.id, t.status === "done" ? "todo" : "done"); });
  if ($("rc")) $("rc").onsubmit = (e) => { e.preventDefault(); runRecommend(); };
  if ($("ob")) $("ob").onsubmit = (e) => { e.preventDefault(); S.profile = { goal: num("ob-goal"), minutes: num("ob-min"), platform: $("ob-pf").value, niche: $("ob-niche").value.trim(), started: todayKey() }; S.tasks = {}; save(); toast("準備ができました。今日の1歩から始めましょう"); render(); };
  if ($("st")) $("st").onsubmit = (e) => { e.preventDefault(); S.profile = { ...(S.profile || {}), goal: num("s-goal"), minutes: num("s-min"), platform: $("s-pf").value, niche: $("s-niche").value.trim(), started: $("s-start").value || todayKey() }; S.tasks = {}; save(); toast("保存しました"); render(); };
  if ($("quiz")) $("quiz").onsubmit = (e) => { e.preventDefault(); const l = COURSES.flatMap((c) => c.lessons).find((x) => x.id === sub); let ok = 0; l.quiz.forEach((q, i) => { const a = Number(new FormData($("quiz")).get("q" + i)); $("exp" + i).hidden = false; $("exp" + i).style.color = a === q.answer ? "var(--good)" : "var(--bad)"; if (a === q.answer) ok++; }); const sc = ok / l.quiz.length; $("score").textContent = `${ok}/${l.quiz.length} 正解（${Math.round(sc * 100)}%）`; if (sc >= 0.8) { S.progress[l.id] = { done: true, score: sc, at: todayKey() }; save(); toast("レッスン完了！"); $("score").insertAdjacentHTML("beforebegin", '<span class="pill good">完了</span>'); } else toast("もう一度本文を読んで挑戦してみましょう"); };
  if ($("gen")) { $("gen").onsubmit = (e) => { e.preventDefault(); const o = S.offers.find((x) => x.id === $("g-offer").value); $("g-body").value = generate($("g-type").value, o, $("g-target").value.trim(), $("g-point").value.trim()); $("out").hidden = false; runLint(); $("out").scrollIntoView({ behavior: "smooth" }); };
    $("g-body").oninput = runLint; if (!$("out").hidden) runLint();
    $("copy").onclick = () => copy($("g-body").value);
    $("savedraft").onclick = () => { const body = $("g-body").value; if (!body.trim()) return toast("本文が空です"); const ex = sub && S.drafts.find((d) => d.id === sub); if (ex) ex.body = body; else S.drafts.push({ id: uid(), title: TYPES[$("g-type").value] + (body.split("\n")[0] ? "：" + body.split("\n")[0].slice(0, 24) : ""), body, createdAt: new Date().toISOString() }); save(); toast("保存しました"); render(); };
    v.querySelectorAll("[data-opendraft]").forEach((b) => b.onclick = () => go("make", b.dataset.opendraft));
    v.querySelectorAll("[data-deldraft]").forEach((b) => b.onclick = () => { S.drafts = S.drafts.filter((d) => d.id !== b.dataset.deldraft); if (sub === b.dataset.deldraft) sub = null; save(); render(); }); }
  if ($("rec")) { $("rec").onsubmit = (e) => { e.preventDefault(); const r = { id: uid(), date: $("r-date").value, platform: $("r-pf").value, clicks: num("r-clicks"), pending: num("r-pending"), confirmed: num("r-confirmed"), imp: num("r-imp"), conv: num("r-conv"), paid: num("r-paid"), note: $("r-note").value.trim() }; if (!r.date) return; S.records = S.records.filter((x) => !(x.date === r.date && x.platform === r.platform)); S.records.push(r); save(); toast("記録しました"); render(); };
    v.querySelectorAll("[data-delrec]").forEach((b) => b.onclick = () => { S.records = S.records.filter((r) => r.id !== b.dataset.delrec); save(); render(); });
    if ($("csv")) $("csv").onclick = () => copy(["日付,媒体,表示回数,クリック数,成約数,発生報酬,確定報酬,入金額,メモ", ...S.records.map((r) => [r.date, PLATFORMS[r.platform], r.imp, r.clicks, r.conv, r.pending, r.confirmed, r.paid, r.note].map((x) => x ?? "").join(","))].join("\n")); }
  if ($("of")) { $("of").onsubmit = (e) => { e.preventDefault(); const o = { id: $("o-id")?.value || uid(), name: $("o-name").value.trim(), asp: $("o-asp").value, amount: num("o-amount"), status: $("o-status").value, cond: $("o-cond").value.trim(), appr: num("o-appr"), note: $("o-note").value.trim() }; const i = S.offers.findIndex((x) => x.id === o.id); if (i >= 0) S.offers[i] = o; else S.offers.push(o); sub = null; save(); toast(i >= 0 ? "更新しました" : "登録しました"); render(); };
    v.querySelectorAll("[data-editoffer]").forEach((b) => b.onclick = () => go("offers", b.dataset.editoffer));
    v.querySelectorAll("[data-deloffer]").forEach((b) => b.onclick = () => { S.offers = S.offers.filter((o) => o.id !== b.dataset.deloffer); save(); render(); }); }
  if ($("exp")) { $("exp").onclick = () => copy(JSON.stringify(S)); $("impbtn").onclick = () => { const ta = $("imp"); if (ta.hidden) { ta.hidden = false; ta.focus(); return; } try { const d = JSON.parse(ta.value); if (!d || typeof d !== "object" || !("records" in d)) throw 0; S = { profile: null, tasks: {}, records: [], offers: [], drafts: [], progress: {}, flags: {}, ...d }; save(); toast("読み込みました"); render(); } catch (e) { toast("読み込めませんでした。JSONを確認してください"); } };
    $("reset1").onclick = () => { $("reset2").hidden = false; }; $("reset4").onclick = () => { $("reset2").hidden = true; }; $("reset3").onclick = () => { S = { profile: null, tasks: {}, records: [], offers: [], drafts: [], progress: {}, flags: {} }; save(); toast("削除しました"); go("home"); }; }
}
function runLint() { $("lint").innerHTML = lint($("g-body").value).map(([c, m]) => `<li class="${c}">${c === "ok" ? "✓" : "！"} ${esc(m)}</li>`).join(""); }
let pop;
function showTerm(btn, e) { e.stopPropagation(); if (pop) pop.remove(); const [t, d] = TERMS[btn.dataset.term]; pop = document.createElement("div"); pop.className = "pop"; pop.setAttribute("role", "dialog"); pop.innerHTML = `<strong>${t}</strong><br>${d}`; document.body.appendChild(pop); const r = btn.getBoundingClientRect(); pop.style.left = Math.max(8, Math.min(window.innerWidth - pop.offsetWidth - 8, r.left)) + "px"; pop.style.top = (r.bottom + 6) + "px"; }
document.addEventListener("click", () => { if (pop) { pop.remove(); pop = null; } });
render();
})();
</script>
